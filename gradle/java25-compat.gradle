def javaCompilerCompatRawDir = layout.buildDirectory.dir("java-compiler-compat/raw")
def javaCompilerCompatClassesDir = layout.buildDirectory.dir("java-compiler-compat/classes")
def javaCompilerCompatLegalDir = layout.buildDirectory.dir("java-compiler-compat/legal")
def javaZipFsCompatRawDir = layout.buildDirectory.dir("java-zipfs-compat/raw")
def javaZipFsCompatClassesDir = layout.buildDirectory.dir("java-zipfs-compat/classes")
def javaZipFsCompatLegalDir = layout.buildDirectory.dir("java-zipfs-compat/legal")
def javaZipFsCompatServiceDir = layout.buildDirectory.dir("java-zipfs-compat/service")
def javaRuntimeRawDir = layout.buildDirectory.dir("java-runtime-for-proguard/raw")
ext.javaRuntimeClassesDir = layout.buildDirectory.dir("java-runtime-for-proguard/classes")
def javaZipFsCompatProviderClass = "jdk.nio.zipfs.ZipFileSystemProvider"

def java25Launcher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(25)
}
def java25Home = java25Launcher.map { it.metadata.installationPath.asFile }
def java25Modules = java25Home.map { new File(it, "lib/modules") }
def java25Executable = { String baseName ->
	java25Home.map {
		def name = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("win") ? "${baseName}.exe" : baseName
		return new File(it, "bin/${name}")
	}
}
def java25Jimage = java25Executable("jimage")

def registerJimageExtract = { String taskName, outputDir, List<String> includes ->
	tasks.register(taskName, Exec) {
		inputs.file(java25Modules)
		outputs.dir(outputDir)

		doFirst {
			def modules = java25Modules.get()
			def jimage = java25Jimage.get()
			def destination = outputDir.get().asFile

			if (!modules.isFile()) {
				throw new GradleException("Unable to locate Java 25 module image: ${modules}")
			}

			if (!jimage.isFile()) {
				throw new GradleException("Unable to locate Java 25 jimage tool: ${jimage}")
			}

			delete destination
			destination.mkdirs()

			def args = ['extract', "--dir=${destination.absolutePath}"]
			includes.each {
				args.add('--include')
				args.add(it)
			}
			args.add(modules.absolutePath)
			commandLine([jimage.absolutePath] + args)
		}
	}
}

def extractJavaCompilerCompat = registerJimageExtract('extractJavaCompilerCompat', javaCompilerCompatRawDir, ['/java.compiler/javax/**'])
def extractJavaZipFsCompat = registerJimageExtract('extractJavaZipFsCompat', javaZipFsCompatRawDir, ['/jdk.zipfs/**'])
def extractJavaRuntimeForProguard = registerJimageExtract('extractJavaRuntimeForProguard', javaRuntimeRawDir, [])

ext.javaCompilerCompatClasses = tasks.register('javaCompilerCompatClasses', Sync) {
	dependsOn extractJavaCompilerCompat
	from(javaCompilerCompatRawDir.map { it.dir("java.compiler") }) {
		include 'javax/annotation/processing/**'
		include 'javax/lang/model/**'
		include 'javax/tools/**'
	}
	into javaCompilerCompatClassesDir
}

ext.javaCompilerCompatLegal = tasks.register('javaCompilerCompatLegal', Sync) {
	from(java25Home.map { new File(it, "legal/java.compiler") }) {
		include 'ADDITIONAL_LICENSE_INFO'
		include 'ASSEMBLY_EXCEPTION'
		include 'LICENSE'
	}
	into javaCompilerCompatLegalDir
}

// Registers jdk.nio.zipfs.ZipFileSystemProvider with the JDK's global FileSystemProvider
// registry via classpath ServiceLoader (FileSystemProvider.installedProviders()), so the "jar"
// scheme works for every library on the stripped Spiral Knights runtime without a JPMS module.
def writeJavaZipFsCompatService = tasks.register('writeJavaZipFsCompatService') {
	inputs.property("providerClass", javaZipFsCompatProviderClass)
	def serviceFile = javaZipFsCompatServiceDir.map { it.file("META-INF/services/java.nio.file.spi.FileSystemProvider") }
	outputs.file(serviceFile)

	doLast {
		def file = serviceFile.get().asFile
		file.parentFile.mkdirs()
		file.text = "${javaZipFsCompatProviderClass}\n"
	}
}

ext.javaZipFsCompatClasses = tasks.register('javaZipFsCompatClasses', Sync) {
	dependsOn extractJavaZipFsCompat, writeJavaZipFsCompatService
	from(javaZipFsCompatRawDir.map { it.dir("jdk.zipfs") }) {
		include 'jdk/nio/zipfs/**'
	}
	from javaZipFsCompatServiceDir
	into javaZipFsCompatClassesDir
}

ext.javaZipFsCompatLegal = tasks.register('javaZipFsCompatLegal', Sync) {
	from(java25Home.map { new File(it, "legal/jdk.zipfs") }) {
		include 'ADDITIONAL_LICENSE_INFO'
		include 'ASSEMBLY_EXCEPTION'
		include 'LICENSE'
	}
	into javaZipFsCompatLegalDir
}

ext.javaRuntimeForProguardClasses = tasks.register('javaRuntimeForProguardClasses', Sync) {
	dependsOn extractJavaRuntimeForProguard
	from(javaRuntimeRawDir) {
		include '**/*.class'
		exclude 'java.compiler/**'
		exclude 'jdk.zipfs/**'
		exclude 'jdk.compiler/**'
		exclude 'jdk.javadoc/**'
		exclude 'jdk.jdeps/**'
		exclude 'jdk.jshell/**'
		exclude '**/module-info.class'
		eachFile {
			def slash = path.indexOf('/')

			if (slash >= 0) {
				path = path.substring(slash + 1)
			}
		}
		includeEmptyDirs = false
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	into javaRuntimeClassesDir
}
